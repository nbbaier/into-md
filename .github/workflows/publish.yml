name: Publish

# Publishing a GitHub release stages the tagged version on npm; it goes
# live once a maintainer approves it with 2FA (`npm stage approve`).
# Auth is npm trusted publishing (OIDC): no token secret. The trusted
# publisher on npmjs.com must name this file, `publish.yml`, exactly,
# and is limited to `npm stage publish`.
on:
   release:
      types: [published]

permissions:
   contents: read

# Never cancel a publish midway; queue a second release behind the first.
concurrency:
   group: publish
   cancel-in-progress: false

jobs:
   # Runs third-party tooling (Bun), so it gets no OIDC token.
   build:
      name: verify · build
      # Pre-releases would otherwise become `latest` on npm.
      if: ${{ !github.event.release.prerelease }}
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4

         - name: Check tag matches package.json version
           env:
              TAG: ${{ github.event.release.tag_name }}
           run: |
              version="v$(jq -r .version package.json)"
              if [ "$TAG" != "$version" ]; then
                echo "::error::Release tag $TAG does not match package.json version $version"
                exit 1
              fi

         - name: Install Bun
           uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: latest

         - name: Install dependencies
           run: bun install --frozen-lockfile

         - name: Lint
           run: bun run check

         - name: Typecheck
           run: bun run typecheck

         - name: Test
           run: bun test

         - name: Build
           run: bun run build

         - uses: actions/upload-artifact@v4
           with:
              name: dist
              path: dist/
              if-no-files-found: error

   # Holds the OIDC token, so it runs only first-party GitHub actions and npm.
   publish:
      name: npm stage publish
      needs: build
      runs-on: ubuntu-latest
      permissions:
         contents: read
         id-token: write # OIDC token for npm trusted publishing
      steps:
         - uses: actions/checkout@v4

         - uses: actions/download-artifact@v4
           with:
              name: dist
              path: dist/

         # Staged publishing needs npm >= 11.15.0 and Node >= 22.14.0.
         - uses: actions/setup-node@v6
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"
              package-manager-cache: false

         - name: Ensure npm supports staged publishing
           run: npm install -g npm@^11.15.0 && npm --version

         - name: Stage for approval
           run: npm stage publish
